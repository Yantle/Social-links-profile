<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <style>
    .attribution { 
      font-size: 12px; 
      text-align: center; 
    }

    .attribution a { 
      color: hsl(228, 45%, 44%); 
    }

    body {
      background: hsl(0, 0%, 8%);
      color: hsl(0, 0%, 100%);
      font-family: "Inter", sans-serif;
      font-size: 14px;
      margin: 0;
    }

    img {
      height: 100px;
      width: 100px;
      border-radius: 50px;
    }

    .card {
      width: 400px;
      height: 530px;
      background: hsl(0, 0%, 12%);
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 10px;
      position: absolute;
      top: 8%;
      left: 37%;
      padding: 20px 0 20px 0;

    }

    button {
      width: 80%;
      height: 50px;
      background: hsl(0, 0%, 20%);
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
      border-radius: 10px;
      border-style: none;
      transition: background 0.3s;
    }

    button:hover {
      background: hsl(75, 94%, 57%);
      cursor: pointer;
      color: black;
    }

  </style>
</head>

<body>
  <div class="card">

      <img src="./assets/images/avatar-jessica.jpeg" alt="Image of Jessica">
      <br>
      <p style="font-size: 27px; margin: 0">Jessica Randall</p>
      <p style="color:hsl(75, 94%, 57%)">London, United Kingdom</p>
      <p>"Front-end developer and avid reader."</p>    
    
      <button>GitHub</button>
      <button>Frontend Mentor</button>
      <button>LinkedIn</button>
      <button>Twitter</button>
      <button>Instagram</button>
  
      
    <div class="attribution">
      Challenge by 

        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      
      Coded by 
        <a href="https://www.linkedin.com/in/yandisa-ngwentle-806372288">Yandisa</a>.
    </div>
  </div><!--end of main class-->
</body>
</html>
